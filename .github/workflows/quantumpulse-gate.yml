name: QuantumPulse PQC Security Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  pqc-governance-audit:
    name: Post-Quantum Cryptographic Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QuantumPulse Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Verify Post-Quantum Compliance Security Gate
        run: |
          python cli/main.py scan samples/cloud_microservice_pqc_cbom.json \
            --fail-on-broken --max-qri 50.0

      - name: Run Cryptographic Audit & SARIF Report Generation
        run: |
          python cli/main.py scan samples/enterprise_banking_cbom.json \
            --format sarif --output results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
